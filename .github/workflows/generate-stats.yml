# Renders the profile cards and publishes them to the gh-pages branch.
#
# One-time setup: Settings -> Pages -> Source -> "Deploy from a branch" -> gh-pages / (root).
# The branch is force-pushed on every run, so it never keeps more than a single commit, and that
# push counts as repository activity, which is what stops GitHub from disabling the schedule after
# 60 idle days.
name: generate-stats

on:
  schedule:
    # 03:00 JST
    - cron: '0 18 * * *'
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'generator/**'
      - '.github/workflows/generate-stats.yml'

permissions:
  contents: write

concurrency:
  group: generate-stats
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Generate cards
        run: dotnet run --project generator -c Release -- --output "${{ runner.temp }}/dist"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to gh-pages
        working-directory: ${{ runner.temp }}/dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b gh-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "Update profile cards ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
